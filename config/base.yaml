# Base configuration. Every tunable parameter lives here, never in code.
# Sections are added phase by phase; values marked TODO are placeholders until their phase.

study_period:
  start: 2025-01-01   # inclusive, UTC
  end: 2025-07-01     # exclusive, UTC (so the last day is 2025-06-30)
  train_frac: 0.65    # first 65% of days for calibration and thresholds (CLAUDE.md)

data:
  raw_dir: data/raw
  clean_dir: data/clean
  currency: ETH
  history_base_url: https://history.deribit.com/api/v2   # trades, instruments
  main_base_url: https://www.deribit.com/api/v2          # DVOL (not on history server)
  page_size: 1000          # max trades per request (API maximum)
  dvol_resolution_s: 3600  # 1-minute DVOL is not available historically
  exclude_block_trades: true   # negotiated off-book, never hit a quote
  exclude_combo_trades: true   # legs priced by allocation inside a combo, not single-leg hits
  # Liquidation trades are kept: they execute against the order book.
  # Bad prints (decision D013): rows that cannot be real are dropped; suspect rows are kept
  # with a flag (is_suspect, suspect_reason) so later phases choose what to use.
  suspect:
    iv_max: 3.0              # trade iv above 300% is suspect (iv <= 0 is always suspect)
    mark_rel_dev: 0.5        # |price - mark| / mark above this ...
    mark_min_ticks: 5        # ... and more than this many minimum ticks away -> suspect
  http:
    max_requests_per_s: 10
    max_retries: 6
    backoff_base_s: 0.5    # wait = base * 2**attempt
    backoff_max_s: 30.0
    timeout_s: 30.0

# Contract specs and fees for the study period (decisions D011, D012).
# `mm.data.cli check` fails if these disagree with Deribit's instrument records.
specs:
  option:
    contract_size_eth: 1.0
    min_order_contracts: 1.0     # also the order increment
    tick_steps:                  # tick size by premium level (ETH)
      - {above_price_eth: 0.0, tick_eth: 0.0001}
      - {above_price_eth: 0.005, tick_eth: 0.0005}
    maker_fee_eth_per_contract: 0.0003   # 0.03% of underlying
    taker_fee_eth_per_contract: 0.0003
    fee_cap_fraction_of_premium: 0.125   # fee <= 12.5% of option price
    delivery_fee_eth_per_contract: 0.00015   # 0.015% of underlying (owner-confirmed, D012)
    delivery_fee_cap_fraction: 0.125         # <= 12.5% of option value (owner-confirmed)
    delivery_fee_exempt_daily: true          # UNVERIFIED (D012)
  perp:
    instrument: ETH-PERPETUAL
    contract_size_usd: 1.0       # inverse (reversed) contract, USD notional
    min_order_usd: 1.0
    tick_usd: 0.05
    maker_fee_rate: 0.0          # H1 2025 schedule; today's API shows a later schedule
    taker_fee_rate: 0.0005

pricing:
  forwards:
    # F(t) = basis(t) x index(t). Basis = F/index moves slowly (carry); index moves fast.
    # Expiry with a dated future: basis from that future's mark/index (same trade).
    future_basis_max_age_s: 3600     # older than this -> treat as missing
    # Expiry without a future (decision D017): interpolate ln(basis) linearly in T between
    # expiries that have a future (ln basis = 0 at T = 0). `parity` instead uses put-call
    # parity on marks, F = K / (1 - (c - p)); kept as an option and a diagnostic only.
    non_future_source: interp        # interp | parity
    parity_pair_window_s: 60         # call and put trade at most this far apart
    parity_atm_band: 0.10            # only strikes with |ln(K/index)| <= this
    parity_n_pairs: 10               # median of the last N pairs ...
    parity_min_pairs: 3              # ... needing at least this many
    parity_max_age_s: 1800           # newest pair older than this -> missing
    basis_bounds: [0.8, 1.25]        # sanity: observations outside are discarded
  validation:                       # Phase 2 done-when (decisions D018, D019)
    min_days_to_expiry: 1.0          # universe: exclude the last day before expiry
    vol_target_min_days: 4.0         # vol target applies to expiries beyond this
    target_median_volpts: 0.05       # |our trade IV - Deribit trade IV|, inclusive mode
    target_p95_volpts: 0.25
    price_target_frac_within_half_tick: 0.95   # all trades: implied price error <= 1/2 tick
    forward_gap_sample: 20000        # rows for the Deribit-implied-forward diagnostic
    seed: 0

sim:
  # Underlying price used for re-pricing is taken this long before each trade.
  latency_ms: 0          # Phase 8 experiment: 0, 1000, 5000

fill:
  # Taker sell at p fills our bid only if bid > p; taker buy fills our ask only if ask < p.
  # Exactly at p: fill this fraction of the eligible size (0.0 by decision D003).
  at_price_fill_fraction: 0.0
  # Fill size = min(trade size, our quote size) * max_fill_fraction.
  max_fill_fraction: 0.5

surface:                     # Surface A: SVI per expiry on Deribit mark IVs (D020-D022)
  refit_interval_s: 300        # 1-5 minutes allowed
  trailing_window_s: 3600      # marks with R - window <= ts < R (30 min too sparse, D020)
  recency_tau_s: 600           # weight = vega * exp(-age / tau): recent marks set the level (D024)
  # input filters
  min_fit_hours: 2.0           # expiries closer than this are not fitted
  min_mark_price_eth: 0.0002   # IV backed out of a tiny mark price is noise
  max_mark_iv: 5.0             # 500%; above this the solver sat near its bracket
  # minimum-data ladder (D021, revised for eSSVI in D023): full -> carry -> none
  min_strikes_full: 3          # 3 eSSVI parameters need >= 3 distinct strikes
  max_carry_s: 7200            # fewer strikes: carry previous fit if younger than this
  cold_start_tries: 6          # multistart for the first fit of an expiry
  # calendar enforcement inside the fit (D023)
  calendar_penalty: 1.0e6      # weight on w_long(k) < w_short(k) on the grid below
  calendar_grid_std: 6.0       # grid spans +- this many std of the slice (and the data)
  calendar_grid_n: 121
  # arbitrage re-checks on every refit (D022, D023)
  k_grid: [-1.5, 1.5, 121]     # log-moneyness grid (lo, hi, points)
  butterfly_tol: 1.0e-9        # g(k) < -tol is a violation
  calendar_tol: 1.0e-7         # w(k,T2) < w(k,T1) - tol is a violation
  # summary statistics
  stats_interval_s: 3600       # per-expiry ATM / RR25 / BF25 every hour
  const_maturity_days: 30      # constant-maturity smile compared with DVOL
  n_workers: 8                 # parallel across time chunks
  chunk_days: 7                # fixed chunks (+ warm-up), so results don't depend on n_workers
  validation:                  # Phase 3 done-when
    rmse_targets:                    # vega/recency-weighted RMSE of full fits, by expiry
      - {min_days: 0, max_days: 10000, median: 0.3, p95: 1.0}   # PROVISIONAL (D025)
    normal_day_dvol_quantile: 0.9    # 'normal' = |daily DVOL change| below this quantile
    target_arb_free_frac: 0.95       # share of refits with no flag on normal days
    target_dvol_change_corr: 0.8     # hourly changes, 30d ATM vs DVOL
